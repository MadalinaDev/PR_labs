version: "3.9"

services:
  leader:
    build:
      context: .
      dockerfile: Dockerfile.leader
    container_name: leader
    ports:
      - "8000:8000"
    environment:
      FOLLOWERS: "http://follower1:8001,http://follower2:8002,http://follower3:8003,http://follower4:8004,http://follower5:8005"
      WRITE_QUORUM: 3
      MIN_DELAY: 0
      MAX_DELAY: 1000

  follower1:
    build:
      context: .
      dockerfile: Dockerfile.follower
    container_name: follower1
    ports:
      - "8001:8001"
    command: uvicorn follower:app --host 0.0.0.0 --port 8001

  follower2:
    build:
      context: .
      dockerfile: Dockerfile.follower
    container_name: follower2
    ports:
      - "8002:8002"
    command: uvicorn follower:app --host 0.0.0.0 --port 8002

  follower3:
    build:
      context: .
      dockerfile: Dockerfile.follower
    container_name: follower3
    ports:
      - "8003:8003"
    command: uvicorn follower:app --host 0.0.0.0 --port 8003

  follower4:
    build:
      context: .
      dockerfile: Dockerfile.follower
    container_name: follower4
    ports:
      - "8004:8004"
    command: uvicorn follower:app --host 0.0.0.0 --port 8004

  follower5:
    build:
      context: .
      dockerfile: Dockerfile.follower
    container_name: follower5
    ports:
      - "8005:8005"
    command: uvicorn follower:app --host 0.0.0.0 --port 8005
